<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Alisa M. Loosen, PhD</title>
    <script>
      // SPA fallback for GitHub Pages: encode the requested path into a query
      // string and redirect to the root, where index.html restores it.
      (function () {
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          '/?p=' + encodeURIComponent(l.pathname + l.search) +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
